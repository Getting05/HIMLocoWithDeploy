# 障碍赛多 policy profile 清单示例。
#
# 每个 profile 指向一个完整机器人 YAML。该 YAML 内部负责配置：
# policy_path、policy_dof_pos、standup_target_pos、action_scale、PD 增益、
# 速度范围以及该 policy 对应的默认姿态。
#
# 所有启用的 profile 必须共享同一套硬件映射、串口、模型路径、
# 关节限位和 control_dt；deploy_node 会在启动时校验这些硬件不变量。
#
# joy_axis 索引来自 sensor_msgs/msg/Joy.axes。
# 方向键映射：
#   上: Axis 7 = -32767
#   右: Axis 6 =  32767
#   下: Axis 7 =  32767
#   左: Axis 6 = -32767
# 运行时也兼容 joy_node 常见的归一化值 -1.0 / 1.0。

initial_profile: walk

profiles:
  - id: walk
    name: normal_walk
    config_file: ../robots/mybot_v2_real.yaml
    joy_axis:
      index: 7
      value: -32767

  - id: stair
    name: stair
    config_file: ../robots/mybot_stair.yaml
    joy_axis:
      index: 6
      value: 32767

  - id: crawl
    name: crawl
    config_file: ../robots/mybot_crawl.yaml
    joy_axis:
      index: 7
      value: 32767

  - id: foot_adduction
    name: foot_adduction
    config_file: ../robots/mybot_foot_adduction.yaml
    joy_axis:
      index: 6
      value: -32767
